name: SPlayerRemote
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "1.4"
    CURRENT_PROJECT_VERSION: "5"

targets:
  SPlayerRemote:
    type: application
    platform: iOS
    sources:
      - path: SPlayerRemote
        excludes:
          - "Info.plist"
      - path: SPlayerRemoteShared
    dependencies:
      - target: SPlayerRemoteLiveActivity
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.splayerremote
        INFOPLIST_FILE: SPlayerRemote/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: APP_TARGET

  SPlayerRemoteLiveActivity:
    type: app-extension
    platform: iOS
    sources:
      - path: SPlayerRemoteLiveActivity
        excludes:
          - "Info.plist"
      - path: SPlayerRemoteShared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.splayerremote.liveactivity
        INFOPLIST_FILE: SPlayerRemoteLiveActivity/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        CODE_SIGN_STYLE: Automatic

  SPlayerRemoteTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - SPlayerRemoteTests
    dependencies:
      - target: SPlayerRemote
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.splayerremote.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/SPlayerRemote.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/SPlayerRemote"
        BUNDLE_LOADER: "$(TEST_HOST)"
